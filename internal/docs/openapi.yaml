openapi: 3.1.0
info:
  title: CPIP Backend API
  version: 1.0.0
  description: |
    Corporate Project Intelligence Platform (CPIP) REST API.

    ## Authentication
    - Public auth endpoints under `/api/v1/auth/*`
    - Secured endpoints require `Authorization: Bearer <access_token>`
    - Secured endpoints also require `X-Tenant-ID` header

    ## Pagination
    List endpoints use cursor pagination via `cursor` and `limit` query params.
    Response includes `meta.next_cursor` when more data is available.

    ## Standard envelope
    ```json
    { "success": true, "data": {}, "meta": {} }
    { "success": false, "error": { "code": "", "message": "" }, "request_id": "" }
    ```
  contact:
    name: CPIP Platform Team
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://{host}
    description: Production
    variables:
      host:
        default: your-app.vercel.app

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Portfolio
  - name: Projects
  - name: Financials
  - name: Resources
  - name: Vendors
  - name: Risks
  - name: Issues
  - name: Change Requests
  - name: Governance
  - name: Imports
  - name: Analytics
  - name: Reports
  - name: Audit
  - name: Integrations

security:
  - bearerAuth: []
    tenantId: []

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe (includes DB ping)
      security: []
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '503':
          $ref: '#/components/responses/Error'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with email, password, and tenant code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout session
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
  /api/v1/auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Verify TOTP MFA
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAVerifyRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /api/v1/users:
    get:
      summary: List users
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpsertRequest'
      responses:
        '201':
          $ref: '#/components/responses/Success'
  /api/v1/users/{id}:
    get:
      summary: Get user
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    put:
      summary: Update user
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpsertRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      summary: Delete user
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/v1/portfolios:
    get:
      summary: List portfolios
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    post:
      summary: Create portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioUpsertRequest'
      responses:
        '201':
          $ref: '#/components/responses/Success'
  /api/v1/portfolios/{id}:
    get:
      summary: Get portfolio
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    put:
      summary: Update portfolio
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortfolioUpsertRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/v1/projects:
    get:
      summary: List projects
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    post:
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpsertRequest'
      responses:
        '201':
          $ref: '#/components/responses/Success'
  /api/v1/projects/{id}:
    get:
      summary: Get project
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    put:
      summary: Update project
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpsertRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      summary: Archive project
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/v1/projects/{id}/financials:
    get:
      summary: Get project financial snapshots
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    post:
      summary: Upsert project financial snapshot
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialUpsertRequest'
      responses:
        '201':
          $ref: '#/components/responses/Success'

  /api/v1/resources:
    get:
      summary: List resources
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    post:
      summary: Create resource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/Success'
  /api/v1/resources/allocations:
    get:
      summary: Get resource allocations
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/v1/vendors:
    get:
      summary: List vendors
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    post:
      summary: Create vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/Success'
  /api/v1/vendors/{id}:
    get:
      summary: Get vendor
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/v1/risks:
    get:
      summary: List risks
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    post:
      summary: Create risk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskUpsertRequest'
      responses:
        '201':
          $ref: '#/components/responses/Success'
  /api/v1/risks/{id}:
    put:
      summary: Update risk
      parameters:
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskUpsertRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/v1/issues:
    get:
      summary: List issues
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    post:
      summary: Create issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/Success'

  /api/v1/change-requests:
    get:
      summary: List change requests
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    post:
      summary: Create change request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRequestCreate'
      responses:
        '201':
          $ref: '#/components/responses/Success'

  /api/v1/governance-reviews:
    get:
      summary: List governance reviews
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    post:
      summary: Create governance review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/Success'

  /api/v1/imports:
    post:
      summary: Submit import job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCreateRequest'
      responses:
        '202':
          $ref: '#/components/responses/Success'
  /api/v1/imports/jobs:
    get:
      summary: List import jobs
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /api/v1/imports/errors:
    get:
      summary: List import errors
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/v1/analytics/executive-summary:
    get:
      summary: Executive analytics summary
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /api/v1/analytics/portfolio-health:
    get:
      summary: Portfolio health analytics
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /api/v1/analytics/financial-performance:
    get:
      summary: Financial performance analytics
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /api/v1/analytics/resource-utilization:
    get:
      summary: Resource utilization analytics
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /api/v1/analytics/risk-exposure:
    get:
      summary: Risk exposure analytics
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/v1/reports/generate:
    post:
      summary: Generate report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportGenerateRequest'
      responses:
        '202':
          $ref: '#/components/responses/Success'
  /api/v1/reports:
    get:
      summary: List reports
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /api/v1/reports/{id}:
    get:
      summary: Get report
      parameters:
        - $ref: '#/components/parameters/PathID'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/v1/audit-logs:
    get:
      tags: [Audit]
      summary: List audit logs
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  /api/v1/integrations/supabase/status:
    get:
      tags: [Integrations]
      summary: Supabase integration status
      description: Returns whether Supabase DB and API credentials are configured.
      responses:
        '200':
          $ref: '#/components/responses/Success'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantId:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: Tenant UUID for multi-tenant isolation
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PathID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Success:
      description: Success response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
      required: [success, data]
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required: [code, message]
        request_id:
          type: string
      required: [success, error]
    LoginRequest:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        tenant_code: { type: string }
      required: [email, password, tenant_code]
    RefreshRequest:
      type: object
      properties:
        refresh_token: { type: string }
      required: [refresh_token]
    MFAVerifyRequest:
      type: object
      properties:
        challenge_id: { type: string }
        totp_code: { type: string, minLength: 6, maxLength: 6 }
      required: [challenge_id, totp_code]
    UserUpsertRequest:
      type: object
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 2, maxLength: 150 }
        password: { type: string, minLength: 8 }
        role_ids:
          type: array
          items: { type: string, format: uuid }
      required: [name]
    PortfolioUpsertRequest:
      type: object
      properties:
        code: { type: string, minLength: 2, maxLength: 40 }
        name: { type: string, minLength: 2, maxLength: 200 }
        owner_user_id: { type: string, format: uuid }
      required: [code, name, owner_user_id]
    ProjectUpsertRequest:
      type: object
      properties:
        portfolio_id: { type: string, format: uuid }
        code: { type: string, minLength: 2, maxLength: 50 }
        name: { type: string, minLength: 2, maxLength: 250 }
        manager_user_id: { type: string, format: uuid }
      required: [portfolio_id, code, name, manager_user_id]
    FinancialUpsertRequest:
      type: object
      properties:
        as_of_date: { type: string, format: date }
        currency: { type: string, minLength: 3, maxLength: 3 }
        budget: { type: number, minimum: 0 }
        actual: { type: number, minimum: 0 }
        forecast: { type: number, minimum: 0 }
      required: [as_of_date, currency, budget, actual, forecast]
    ResourceCreateRequest:
      type: object
      properties:
        employee_code: { type: string, minLength: 2, maxLength: 50 }
        name: { type: string, minLength: 2, maxLength: 150 }
        role_title: { type: string, minLength: 2, maxLength: 100 }
        manager_user_id: { type: string, format: uuid }
      required: [employee_code, name, role_title]
    VendorCreateRequest:
      type: object
      properties:
        code: { type: string, minLength: 2, maxLength: 40 }
        name: { type: string, minLength: 2, maxLength: 200 }
        category: { type: string, minLength: 2, maxLength: 80 }
      required: [code, name, category]
    RiskUpsertRequest:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        code: { type: string, minLength: 2, maxLength: 40 }
        title: { type: string, minLength: 2, maxLength: 250 }
        likelihood: { type: integer, minimum: 1, maximum: 5 }
        impact: { type: integer, minimum: 1, maximum: 5 }
        owner_user_id: { type: string, format: uuid }
      required: [project_id, code, title, likelihood, impact, owner_user_id]
    IssueCreateRequest:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        code: { type: string, minLength: 2, maxLength: 40 }
        title: { type: string, minLength: 2, maxLength: 250 }
        severity: { type: string, enum: [low, medium, high, critical] }
      required: [project_id, code, title, severity]
    ChangeRequestCreate:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        code: { type: string, minLength: 2, maxLength: 40 }
        change_type: { type: string, enum: [scope, budget, timeline, quality] }
        impact_cost: { type: number, minimum: 0 }
        impact_days: { type: integer, minimum: 0 }
        description: { type: string, minLength: 5, maxLength: 2000 }
      required: [project_id, code, change_type, impact_cost, impact_days, description]
    GovernanceCreateRequest:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        review_date: { type: string, format: date }
        outcome: { type: string, enum: [approved, conditional, rejected] }
        notes: { type: string }
      required: [project_id, review_date, outcome]
    ImportCreateRequest:
      type: object
      properties:
        source_type: { type: string, enum: [excel, csv, erp_export, api] }
        file_ref: { type: string }
        template_id: { type: string, format: uuid }
      required: [source_type, file_ref, template_id]
    ReportGenerateRequest:
      type: object
      properties:
        report_type: { type: string, enum: [executive, portfolio, financial, resource, risk, vendor] }
        format: { type: string, enum: [pdf, xlsx, csv] }
        filters:
          type: object
          additionalProperties: true
      required: [report_type, format]
